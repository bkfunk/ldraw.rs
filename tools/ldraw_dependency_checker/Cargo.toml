[package]
name = "ldraw_dependency_checker"
version = "0.1.0"
edition = "2021"

[dependencies]
ldraw = { path = "../../ldraw" }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.0"
async-trait.workspace = true